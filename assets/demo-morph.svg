<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200" role="img" aria-label="Path morphing and stroke reveal">
  <rect width="380" height="200" fill="#000000"/>

  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>

  <!-- morphing shape -->
  <g transform="translate(110,105)">
    <path fill="none" stroke="url(#ink)" stroke-width="3" stroke-linejoin="round"
          d="M0 -42 C23 -42 42 -23 42 0 C42 23 23 42 0 42 C-23 42 -42 23 -42 0 C-42 -23 -23 -42 0 -42 Z">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
        values="M0 -42 C23 -42 42 -23 42 0 C42 23 23 42 0 42 C-23 42 -42 23 -42 0 C-42 -23 -23 -42 0 -42 Z;
                M-38 -38 L38 -38 L38 38 L-38 38 Z;
                M0 -42 C23 -42 42 -23 42 0 C42 23 23 42 0 42 C-23 42 -42 23 -42 0 C-42 -23 -23 -42 0 -42 Z"/>
    </path>
  </g>

  <!-- stroke reveal -->
  <g transform="translate(255,105)" fill="none" stroke="url(#ink)" stroke-width="3" stroke-linecap="round">
    <path d="M-45 0 q 22 -36 45 0 q 22 36 45 0" stroke-dasharray="150" stroke-dashoffset="150">
      <animate attributeName="stroke-dashoffset" values="150;0;0;-150;-150;150" keyTimes="0;0.2;0.45;0.65;0.85;1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
