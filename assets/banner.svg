<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="FastSVG">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a3e635;#fbbf24;#f472b6;#818cf8;#22d3ee" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a3e635">
        <animate attributeName="stop-color" values="#a3e635;#fbbf24;#f472b6;#818cf8;#22d3ee;#a3e635" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <path id="morph" d="M0 -34 C19 -34 34 -19 34 0 C34 19 19 34 0 34 C-19 34 -34 19 -34 0 C-34 -19 -19 -34 0 -34 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.33;0.66;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
        values="M0 -34 C19 -34 34 -19 34 0 C34 19 19 34 0 34 C-19 34 -34 19 -34 0 C-34 -19 -19 -34 0 -34 Z;
                M-30 -30 L30 -30 L30 30 L-30 30 Z;
                M0 -38 L34 26 L-34 26 Z;
                M0 -34 C19 -34 34 -19 34 0 C34 19 19 34 0 34 C-19 34 -34 19 -34 0 C-34 -19 -19 -34 0 -34 Z"/>
    </path>
  </defs>

  <rect width="1200" height="280" fill="#000000"/>

  <!-- wordmark: tek text, tspans yan yana → çakışma yok -->
  <text x="120" y="158" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace"
        font-size="80" font-weight="700" letter-spacing="-3">
    <tspan fill="#9ca3af">Fast</tspan><tspan fill="url(#sweep)">SVG</tspan>
  </text>

  <!-- accent line -->
  <rect x="122" y="186" width="470" height="2" fill="url(#sweep)"/>

  <text x="122" y="226" font-family="ui-monospace, Menlo, monospace" font-size="15"
        letter-spacing="3" fill="#4b5563">GEOMETRY · COLOR · MOTION · APNG</text>

  <!-- morph glyph -->
  <g transform="translate(1010,140)">
    <use href="#morph" fill="none" stroke="url(#sweep)" stroke-width="3"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#1f2937" stroke-width="2">
    <path d="M24 24 h14 M24 24 v14 M1176 24 h-14 M1176 24 v14 M24 256 h14 M24 256 v-14 M1176 256 h-14 M1176 256 v-14"/>
  </g>
</svg>
