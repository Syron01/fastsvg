<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220" role="img" aria-label="Deterministic particle and frame render demo">
  <rect width="380" height="220" fill="#000000"/>
  <text x="20" y="32" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#6b7280">003 · SEEDED PARTICLES · 10 FPS</text>

  <!-- deterministic orbiting particles (same seed = same frames) -->
  <g transform="translate(190,125)">
    <g>
      <circle r="3" fill="#22d3ee">
        <animateMotion dur="4s" repeatCount="indefinite" path="M0 0 a 60 40 0 1 0 0.1 0"/>
      </circle>
      <circle r="2.5" fill="#a3e635">
        <animateMotion dur="4s" begin="0.4s" repeatCount="indefinite" path="M0 0 a 60 40 0 1 0 0.1 0"/>
      </circle>
      <circle r="2" fill="#fbbf24">
        <animateMotion dur="4s" begin="0.8s" repeatCount="indefinite" path="M0 0 a 60 40 0 1 0 0.1 0"/>
      </circle>
      <circle r="2" fill="#f472b6">
        <animateMotion dur="4s" begin="1.2s" repeatCount="indefinite" path="M0 0 a 60 40 0 1 0 0.1 0"/>
      </circle>
      <circle r="1.6" fill="#94a3b8">
        <animateMotion dur="4s" begin="1.6s" repeatCount="indefinite" path="M0 0 a 60 40 0 1 0 0.1 0"/>
      </circle>
      <circle r="1.6" fill="#818cf8">
        <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M0 0 a 60 40 0 1 0 0.1 0"/>
      </circle>
      <!-- anchor -->
      <rect x="-8" y="-8" width="16" height="16" rx="3" fill="none" stroke="#374151" stroke-width="1.5"/>
    </g>
  </g>

  <!-- frame counter strip -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#4b5563" text-anchor="middle">
    <text x="60" y="196">F0</text><text x="110" y="196">F1</text><text x="160" y="196">F2</text><text x="210" y="196">F3</text><text x="260" y="196">F4</text>
    <g stroke="#1f2937"><line x1="40" y1="184" x2="280" y2="184"/></g>
    <circle cx="60" cy="172" r="2" fill="#22d3ee"><animate attributeName="opacity" values="1;0.2;0.2;0.2;0.2;1" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="172" r="2" fill="#22d3ee"><animate attributeName="opacity" values="0.2;1;0.2;0.2;0.2;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="172" r="2" fill="#22d3ee"><animate attributeName="opacity" values="0.2;0.2;1;0.2;0.2;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="172" r="2" fill="#22d3ee"><animate attributeName="opacity" values="0.2;0.2;0.2;1;0.2;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="172" r="2" fill="#22d3ee"><animate attributeName="opacity" values="0.2;0.2;0.2;0.2;1;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
