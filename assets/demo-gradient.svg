<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200" role="img" aria-label="Perceptual gradient and spring easing">
  <rect width="380" height="200" fill="#000000"/>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"><animate attributeName="stop-color" values="#1e3a8a;#7c3aed;#db2777;#ea580c" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.25" stop-color="#385ca6"><animate attributeName="stop-color" values="#385ca6;#8b3fc0;#e03a6f;#ef6a1a" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#5f82c4"><animate attributeName="stop-color" values="#5f82c4;#a44fd0;#e4585f;#f08320" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.75" stop-color="#93aee0"><animate attributeName="stop-color" values="#93aee0;#c77fe0;#ec8b53;#f6a63a" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#c9dcf7"><animate attributeName="stop-color" values="#c9dcf7;#e9b8f2;#f6c858;#fcd468" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>

  <!-- perceptual gradient bar -->
  <rect x="40" y="52" width="300" height="30" rx="4" fill="url(#bar)"/>

  <!-- damped spring -->
  <rect x="40" y="118" width="300" height="10" rx="5" fill="#111827"/>
  <rect x="40" y="118" width="18" height="10" rx="5" fill="url(#bar)">
    <animate attributeName="width" dur="3.5s" repeatCount="indefinite"
      values="18;288;272;290;284;288;18"
      keyTimes="0;0.35;0.42;0.5;0.58;0.66;1"
      calcMode="spline" keySplines="0.2 0 0.4 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>
  <rect x="338" y="112" width="2" height="22" fill="#1f2937"/>
</svg>
