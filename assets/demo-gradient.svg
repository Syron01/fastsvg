<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220" role="img" aria-label="OKLab gradient and spring easing demo">
  <rect width="380" height="220" fill="#000000"/>
  <text x="20" y="32" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#6b7280">002 · OKLAB GRADIENT + SPRING</text>

  <defs>
    <linearGradient id="oklabbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"><animate attributeName="stop-color" values="#1e3a8a;#7c3aed;#db2777;#ea580c" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="0.25" stop-color="#385ca6"><animate attributeName="stop-color" values="#385ca6;#8b3fc0;#e03a6f;#ef6a1a" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#5f82c4"><animate attributeName="stop-color" values="#5f82c4;#a44fd0;#e4585f;#f08320" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="0.75" stop-color="#93aee0"><animate attributeName="stop-color" values="#93aee0;#c77fe0;#ec8b53;#f6a63a" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#c9dcf7"><animate attributeName="stop-color" values="#c9dcf7;#e9b8f2;#f6c858;#fcd468" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>

  <!-- perceptually interpolated bar, hue-animated -->
  <rect x="20" y="60" width="340" height="36" rx="4" fill="url(#oklabbar)"/>
  <text x="20" y="116" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4b5563">ΔE-CONTINUOUS · NO BANDING · HUE-LOCKED</text>

  <!-- damped spring: bar grows with overshoot -->
  <g transform="translate(20,150)">
    <rect x="0" y="0" width="340" height="12" rx="6" fill="#111827"/>
    <rect x="0" y="0" width="20" height="12" rx="6" fill="url(#oklabbar)">
      <animate attributeName="width" dur="3s" repeatCount="indefinite"
        values="20;300;282;302;296;300;20"
        keyTimes="0;0.35;0.42;0.5;0.58;0.66;1"
        calcMode="spline" keySplines="0.2 0 0.4 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <text x="0" y="40" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#4b5563">ζ = 0.5 · OVERSHOOT ~2%</text>
  </g>
</svg>
