name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: MCP stdio smoke test
        run: node scripts/mcp-smoke.mjs
      - name: CLI smoke test
        run: |
          npx tsx apps/cli/src/main.ts validate packages/geometry/test/fixtures/path.d || true
